# Flujo E2E 02: registro de labor con insumo (HU-12, HU-13).
appId: com.terravidmza.mobile
tags:
  - labores
---
- runFlow: subflows/login.yaml
- tapOn:
    id: "tab-labores"
- runFlow:
    file: subflows/cargar-labor.yaml
    env:
      CANTIDAD: "150"
# Vuelve a la lista con la labor nueva arriba.
- assertVisible: ${TIPO_LABOR}
