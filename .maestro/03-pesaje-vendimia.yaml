# Flujo E2E 03: pesaje diario de vendimia (HU-24, HU-27).
appId: com.terravidmza.mobile
tags:
  - vendimia
---
- runFlow: subflows/login.yaml
- tapOn:
    id: "tab-pesaje"
- tapOn:
    id: "fab-nuevo-pesaje"
- assertVisible: "Nuevo pesaje"
- tapOn:
    id: "selector-finca"
- tapOn: ${FINCA}
- tapOn:
    id: "selector-cuadrilla"
- tapOn: ${CUADRILLA}
- tapOn:
    id: "selector-cuartel"
- tapOn: ${CUARTEL + '.*'}
- tapOn:
    id: "input-peso-kg"
- inputText: "1250"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "boton-guardar-pesaje"
- tapOn:
    id: "boton-guardar-pesaje"
- assertVisible: "Pesaje guardado"
- tapOn: "Aceptar"
# La lista formatea con es-AR: "1.250 kg".
- assertVisible: ${CUADRILLA}
- assertVisible: "1.250 kg"
