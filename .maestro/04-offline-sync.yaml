# Flujo E2E 04: carga sin señal y sincronización al volver (HU-14, M-003).
# setAirplaneMode solo funciona en Android.
appId: com.terravidmza.mobile
tags:
  - offline
  - sync
---
- runFlow: subflows/login.yaml
# El login entra al inicio antes de que terminen de bajar los catálogos; si
# se corta la señal en ese momento, los cuarteles quedan vacíos. Se refresca
# con pull-to-refresh y se confirma que el cuartel ya está en el teléfono.
- tapOn:
    id: "tab-labores"
- swipe:
    start: 50%, 35%
    end: 50%, 80%
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    id: "fab-nueva-labor"
- tapOn:
    id: "selector-finca"
- tapOn: ${FINCA}
- tapOn:
    id: "selector-cuartel"
- assertVisible: ${CUARTEL + '.*'}
- back
- back
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: "banner-offline"
    timeout: 10000
- assertVisible:
    id: "sync-offline"
- tapOn:
    id: "tab-labores"
- runFlow:
    file: subflows/cargar-labor.yaml
    env:
      CANTIDAD: "50"
      INSUMO: ""
- assertVisible: "Modo Offline.*1 pendientes.*"
- setAirplaneMode: disabled
# Al volver la señal sube sola; no hace falta tocar nada.
- extendedWaitUntil:
    notVisible:
      id: "banner-offline"
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: "sync-pendientes"
    timeout: 30000
- assertNotVisible:
    id: "sync-offline"
