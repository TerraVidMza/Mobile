# Flujo E2E 04: carga sin señal y sincronización al volver (HU-14, M-003).
# setAirplaneMode solo funciona en Android.
appId: com.terravidmza.mobile
tags:
  - offline
  - sync
---
- runFlow: subflows/login.yaml
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: "banner-offline"
    timeout: 10000
- assertVisible:
    id: "sync-offline"
- tapOn:
    id: "tab-labores"
- runFlow:
    file: subflows/cargar-labor.yaml
    env:
      CANTIDAD: "50"
      INSUMO: ""
- assertVisible: "Modo Offline.*1 pendientes.*"
- setAirplaneMode: disabled
# Al volver la señal sube sola; no hace falta tocar nada.
- extendedWaitUntil:
    notVisible:
      id: "banner-offline"
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: "sync-pendientes"
    timeout: 30000
- assertNotVisible:
    id: "sync-offline"
