# Configuracion de SonarCloud (modo "Automatic Analysis").
#
# Por que SonarCloud: la app no tenia ningun analizador estatico (solo tsc).
# SonarCloud analiza TypeScript/React Native sin configurar un linter por
# proyecto y agrega seguridad, duplicacion, deuda tecnica y una Quality Gate
# por rama y por PR. Es gratuito para repositorios publicos.
#
# En modo automatico SonarCloud clona el repo en cada push a main y en cada PR y
# lee este archivo. No hace falta workflow ni token.

# Codigo de la app (Expo Router + stores + servicios). dist/ es el export web.
sonar.sources=src
# Tests de Jest junto al codigo, mocks globales y flujos de Maestro.
sonar.tests=src,__mocks__,.maestro
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,__mocks__/**,.maestro/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx

sonar.sourceEncoding=UTF-8
