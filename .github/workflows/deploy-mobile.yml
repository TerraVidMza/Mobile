name: TerraVid Mobile CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Tests & Smoke Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Check
        run: npm run typecheck

      - name: Run Jest Test Suites with Coverage
        run: npm test -- --coverage --coverageReporters=text-summary --coverageReporters=lcov

      - name: Publish Coverage to Step Summary
        if: always()
        run: |
          echo "### Cobertura de pruebas" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage/lcov-report/index.html 2>/dev/null | grep -o '[0-9.]*% *</span>' | head -4 | sed 's/<\/span>//' >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Web Production Smoke Test
        run: npm run test:smoke
        env:
          EXPO_PUBLIC_API_BASE_URL: 'https://terravid-api.duckdns.org/api'

  build-web:
    name: Build Web Production Bundle
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export Web Production Bundle
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL || 'https://terravid-api.duckdns.org/api' }}

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # La PWA se publica en Firebase Hosting (sitio terravid-mobile del proyecto
  # terravid-24041, el mismo de la Web). Antes iba por SSH a la VM; la copia de
  # la VM queda sin actualizar y sirve la última versión (M-014).
  deploy-firebase:
    name: Despliegue en Firebase Hosting
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TERRAVID_24041 }}
          channelId: live
          projectId: terravid-24041
          target: terravid-mobile

      - name: Post-Deployment Health Check
        run: |
          curl --retry 5 --retry-delay 3 --retry-all-errors -I -f https://terravid-mobile.web.app

      - name: Publish Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Despliegue de Mobile (PWA) correcto" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Despliegue de Mobile (PWA) FALLÓ" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Recurso | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://terravid-mobile.web.app |" >> $GITHUB_STEP_SUMMARY
          echo "| Rama | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Estado | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
